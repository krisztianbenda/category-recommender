name: Node.js and npm dependencies
description: Installs Node.js from .nvmrc and runs npm ci in one directory, with the npm cache.
inputs:
  directory:
    description: The directory that holds package-lock.json
    default: "."
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: ${{ inputs.directory }}/package-lock.json
    - name: npm ci
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: npm ci
