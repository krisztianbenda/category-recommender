# Egress deny for the catrec service user (constitution I, research R14).
# Replies on established inbound connections are allowed; everything else leaving the host
# from a catrec-owned socket is dropped.
table inet catrec {
  chain output {
    type filter hook output priority 0; policy accept;
    meta skuid "catrec" oif "lo" accept
    meta skuid "catrec" ct state established,related accept
    meta skuid "catrec" log prefix "catrec-egress-drop " drop
  }
}
