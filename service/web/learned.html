<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Learned Data</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <strong>Category Recommender</strong>
      <nav>
        <a href="/">Suggest</a>
        <a href="/sets.html">Category sets</a>
        <a href="/learned.html" aria-current="page">Learned data</a>
      </nav>
    </header>

    <main class="grid">
      <section class="card">
        <h1>What the system has learned</h1>
        <label
          >Set
          <select id="set-picker"></select
        ></label>
        <table>
          <thead>
            <tr>
              <th>Category</th>
              <th>Examples</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="counts"></tbody>
        </table>
        <p id="status" class="error" role="status"></p>
      </section>

      <section class="card">
        <h2 id="list-title">Examples</h2>
        <table>
          <thead>
            <tr>
              <th>Email</th>
              <th>Category</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="examples"></tbody>
        </table>
        <div class="actions">
          <button id="more" type="button" class="secondary" hidden>Show more</button>
        </div>
      </section>

      <section class="card">
        <h2>Delete everything</h2>
        <p>
          Removes all category sets, categories, learned examples and accuracy history. This cannot
          be undone.
        </p>
        <label
          >Type <strong>DELETE ALL</strong> to confirm <input id="confirm-text" autocomplete="off"
        /></label>
        <button id="delete-all" type="button" class="danger">Delete all my data</button>
      </section>
    </main>

    <script type="module" src="/learned.js"></script>
  </body>
</html>
