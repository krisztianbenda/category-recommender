<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Category Sets</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <strong>Category Recommender</strong>
      <nav>
        <a href="/">Suggest</a>
        <a href="/sets.html" aria-current="page">Category sets</a>
        <a href="/learned.html">Learned data</a>
      </nav>
    </header>

    <main class="grid">
      <section class="card">
        <h1>Category sets</h1>
        <label
          >Set
          <select id="set-picker"></select
        ></label>
        <div class="actions">
          <button id="rename-set" type="button" class="secondary">Rename set</button>
          <button id="delete-set" type="button" class="danger">Delete set</button>
        </div>
        <form id="new-set">
          <h2>New set</h2>
          <label>Name <input name="name" maxlength="80" required /></label>
          <label
            >Categories, one per line (optional)
            <textarea
              name="categories"
              rows="4"
              placeholder="Family&#10;Family/Baby&#10;Gadgets"
            ></textarea>
          </label>
          <button type="submit">Create set</button>
        </form>
        <p id="status" class="error" role="status"></p>
      </section>

      <section class="card">
        <h2 id="set-title">Categories</h2>
        <form id="add-category" class="row">
          <input
            class="grow"
            name="path"
            placeholder="New category, e.g. Travelling/Trip Lisbon"
            required
          />
          <button type="submit">Add</button>
        </form>
        <ul id="tree" class="tree"></ul>
        <p class="muted">
          Categories are at most two levels deep. Renaming or moving keeps what was learned.
        </p>
      </section>
    </main>

    <script type="module" src="/sets.js"></script>
  </body>
</html>
